name: Render MODEL 2.9 iteration 0002 concept PNGs
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/livery-v2-render.yml"
      - "livery/iterations/0002-2026-10-11-ghost-aerodynamics/render-concept.mjs"
      - "livery/iterations/0002-2026-10-11-ghost-aerodynamics/concept-config.json"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate deterministic side-view concept SVGs
        run: node livery/iterations/0002-2026-10-11-ghost-aerodynamics/render-concept.mjs
      - name: Install SVG rasterizer
        run: python -m pip install cairosvg pillow
      - name: Render reviewed raster preview set and verify sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image
          base = Path("livery/iterations/0002-2026-10-11-ghost-aerodynamics/previews")
          for name in ("ghost-aero-day","ghost-aero-night","ghost-aero-anatomy","ghost-aero-comparison"):
              svg = base / f"{name}.svg"
              png = base / f"{name}.png"
              cairosvg.svg2png(url=str(svg),write_to=str(png))
              with Image.open(png) as im:
                  expected=(1800,1720) if name.endswith("comparison") else (1800,860)
                  assert im.size == expected,(png,im.size)
              print(png,png.stat().st_size)
          PY
      - name: Commit reproducible PNG previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livery/iterations/0002-2026-10-11-ghost-aerodynamics/previews/
          if ! git diff --cached --quiet; then
            git commit -m "Add raster previews for MODEL 2.9 V2 integrated side study"
            git push
          fi
