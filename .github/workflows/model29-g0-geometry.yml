name: MODEL 2.9 G0 blank geometry previews
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/model29-g0-geometry.yml"
      - "livery/iterations/0003-2026-10-11-track-kinetics/g0/generate.mjs"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate reproducible G0 SVG and anchor JSON
        run: node livery/iterations/0003-2026-10-11-track-kinetics/g0/generate.mjs
      - name: Rasterize study PNGs (no source photos)
        run: |
          python -m pip install cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cairosvg, json
          folder=Path('livery/iterations/0003-2026-10-11-track-kinetics/g0/previews')
          for name in ['blank-m3p-side','dimension-check']:
              svg=folder/(name+'.svg')
              assert svg.exists()
              dst=folder/(name+'.png')
              cairosvg.svg2png(url=str(svg),write_to=str(dst))
              with Image.open(dst) as im:
                  assert im.size==(2200,1040), (im.size,str(dst))
                  print('rendered',dst,'size',dst.stat().st_size)
          obj=json.loads((folder/'geometry.json').read_text())
          m=obj['officialDimensionsMm']
          assert m['frontOverhang']+m['wheelbase']+m['rearOverhang']==m['length']
          assert obj['geometryLocked'] is False
          PY
      - name: Commit G0 output images and geometry JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livery/iterations/0003-2026-10-11-track-kinetics/g0/previews/
          if ! git diff --cached --quiet; then
            git commit -m "Render blank 2024+ M3P G0 dimensioned silhouette preview"
            git push
          fi
